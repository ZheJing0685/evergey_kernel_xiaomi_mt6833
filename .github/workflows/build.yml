name: Build evergey Kernel

on:
  workflow_dispatch:
    inputs:
      with_ksu:
        description: "Build with KernelSU Next + SUSFS"
        required: true
        default: false
        type: boolean

      jobs:
        description: "Kernel compile jobs"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

  push:
    branches:
      - lineage-23.2

permissions:
  contents: read

jobs:
  build:
    name: Build MT6833 Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      LLVM: 1
      LLVM_IAS: 1

      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github-actions

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. Runner information
      # ============================================================

      - name: Show build environment
        run: |
          echo "========================================"
          echo "CPU"
          echo "========================================"

          nproc
          lscpu

          echo
          echo "========================================"
          echo "MEMORY"
          echo "========================================"

          free -h

          echo
          echo "========================================"
          echo "DISK"
          echo "========================================"

          df -h

          echo
          echo "========================================"
          echo "GIT"
          echo "========================================"

          git branch --show-current
          git rev-parse HEAD

          echo
          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          make kernelversion

      # ============================================================
      # 4. Check source
      # ============================================================

      - name: Check source
        run: |
          echo "========================================"
          echo "Checking source tree"
          echo "========================================"

          if [ ! -f "build.sh" ]; then
            echo "ERROR: build.sh not found!"
            exit 1
          fi

          if [ ! -f "arch/arm64/configs/everpal_defconfig" ]; then
            echo "ERROR: everpal_defconfig not found!"
            exit 1
          fi

          chmod +x build.sh

          echo
          echo "build.sh:"
          ls -lh build.sh

          echo
          echo "everpal_defconfig:"
          ls -lh arch/arm64/configs/everpal_defconfig

      # ============================================================
      # 5. Inspect critical Makefile settings
      # ============================================================

      - name: Inspect kernel toolchain settings
        run: |
          echo "========================================"
          echo "Top-level Makefile toolchain section"
          echo "========================================"

          sed -n '270,380p' Makefile

          echo
          echo "========================================"
          echo "ARM64 Makefile compiler section"
          echo "========================================"

          sed -n '38,75p' arch/arm64/Makefile

      # ============================================================
      # 6. Workflow configuration
      # ============================================================

      - name: Show workflow configuration
        run: |
          echo "========================================"
          echo "Workflow configuration"
          echo "========================================"

          echo "ARCH       = $ARCH"
          echo "SUBARCH    = $SUBARCH"
          echo "LLVM       = $LLVM"
          echo "LLVM_IAS   = $LLVM_IAS"

          echo
          echo "KernelSU:"
          echo "${{ github.event.inputs.with_ksu || 'false' }}"

          echo
          echo "Build jobs:"
          echo "${{ github.event.inputs.jobs || '2' }}"

      # ============================================================
      # 7. Prepare directories
      # ============================================================

      - name: Prepare build directories
        run: |
          mkdir -p out
          mkdir -p artifacts

      # ============================================================
      # 8. Build
      # ============================================================

      - name: Build kernel
        env:
          BUILD_JOBS: ${{ github.event.inputs.jobs || '2' }}
          WITH_KSU: ${{ github.event.inputs.with_ksu || 'false' }}

        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD START"
          echo "========================================"

          echo "BUILD_JOBS=$BUILD_JOBS"
          echo "WITH_KSU=$WITH_KSU"

          echo
          echo "========================================"

          if [ "$WITH_KSU" = "true" ]; then

            echo "KernelSU Next + SUSFS: ENABLED"

            ./build.sh --with-ksu 2>&1 | tee build.log

          else

            echo "KernelSU Next + SUSFS: DISABLED"

            ./build.sh 2>&1 | tee build.log

          fi

      # ============================================================
      # 9. Diagnostics
      # ============================================================

      - name: Build diagnostics
        if: always()
        run: |
          echo "========================================"
          echo "BUILD LOG - LAST 400 LINES"
          echo "========================================"

          if [ -f build.log ]; then
            tail -400 build.log
          else
            echo "build.log not found."
          fi

          echo
          echo "========================================"
          echo "KERNEL IMAGES"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "Image-dtb" \
            \) \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            -print

          echo
          echo "========================================"
          echo "DTB"
          echo "========================================"

          find . \
            -type f \
            -name "*.dtb" \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            -print

          echo
          echo "========================================"
          echo "KO MODULES"
          echo "========================================"

          find . \
            -type f \
            -name "*.ko" \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            -print

          echo
          echo "========================================"
          echo "ZIP FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            -print

          echo
          echo "========================================"
          echo "DISK"
          echo "========================================"

          df -h

      # ============================================================
      # 10. Verify kernel image
      # ============================================================

      - name: Verify kernel image
        if: success()
        run: |
          IMAGE="out/arch/arm64/boot/Image.gz"

          echo "========================================"
          echo "VERIFY KERNEL"
          echo "========================================"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image.gz not found!"
            exit 1
          fi

          echo "Kernel:"
          ls -lh "$IMAGE"

          echo
          file "$IMAGE"

      # ============================================================
      # 11. Collect AnyKernel ZIP
      # ============================================================

      - name: Collect AnyKernel ZIP
        if: success()
        run: |
          set -e

          mkdir -p artifacts

          echo "========================================"
          echo "SEARCHING FOR KERNEL ZIP"
          echo "========================================"

          ZIP_FILE=$(find . \
            -type f \
            -name "AquaKernel-*.zip" \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then

            echo "ERROR: AquaKernel ZIP not found!"

            echo
            echo "All ZIP files:"
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print

            echo
            echo "Repository root:"
            ls -lah

            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          cp "$ZIP_FILE" artifacts/

          echo
          echo "Artifact:"
          ls -lh artifacts/

      # ============================================================
      # 12. Upload kernel
      # ============================================================

      - name: Upload kernel ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evergey-kernel-lineage-23.2
          path: artifacts/AquaKernel-*.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 13. Upload build log
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evergey-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
