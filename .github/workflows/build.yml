name: Build evergey Kernel

on:
  workflow_dispatch:
    inputs:
      with_ksu:
        description: "Build with KernelSU Next + SUSFS"
        required: true
        default: false
        type: boolean

      jobs:
        description: "Kernel compile jobs"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

  push:
    branches:
      - lineage-23.2

permissions:
  contents: read

jobs:
  build:
    name: Build MT6833 Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github-actions

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean

          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Show build environment
        run: |
          echo "===== CPU ====="
          nproc
          lscpu

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== DISK ====="
          df -h

          echo
          echo "===== GIT ====="
          git rev-parse HEAD

          echo
          echo "===== KERNEL ====="
          make kernelversion

      - name: Check source
        run: |
          if [ ! -f arch/arm64/configs/everpal_defconfig ]; then
            echo "ERROR: everpal_defconfig not found!"
            exit 1
          fi

          if [ ! -f build.sh ]; then
            echo "ERROR: build.sh not found!"
            exit 1
          fi

          chmod +x build.sh

          echo "everpal_defconfig:"
          ls -lh arch/arm64/configs/everpal_defconfig

          echo
          echo "build.sh:"
          ls -lh build.sh

      - name: Prepare build environment
        run: |
          mkdir -p out
          mkdir -p artifacts

          echo "ARCH=$ARCH"
          echo "SUBARCH=$SUBARCH"
          echo "LLVM=$LLVM"
          echo "LLVM_IAS=$LLVM_IAS"

      - name: Build kernel
        env:
          BUILD_JOBS: ${{ github.event.inputs.jobs || '2' }}
          WITH_KSU: ${{ github.event.inputs.with_ksu || 'false' }}

        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          echo "BUILD_JOBS=$BUILD_JOBS"
          echo "WITH_KSU=$WITH_KSU"

          echo
          echo "========================================"
          echo "START BUILD"
          echo "========================================"

          if [ "$WITH_KSU" = "true" ]; then
            ./build.sh --with-ksu 2>&1 | tee build.log
          else
            ./build.sh 2>&1 | tee build.log
          fi

      - name: Show build result
        if: always()
        run: |
          echo "========================================"
          echo "LAST 300 LINES"
          echo "========================================"

          if [ -f build.log ]; then
            tail -300 build.log
          fi

          echo
          echo "========================================"
          echo "IMAGE"
          echo "========================================"

          find . -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
            \) \
            -not -path "./.git/*" \
            -print

          echo
          echo "========================================"
          echo "DTB"
          echo "========================================"

          find . \
            -type f \
            -name "*.dtb" \
            -not -path "./.git/*" \
            -print

          echo
          echo "========================================"
          echo "ZIP"
          echo "========================================"

          find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            -print

      - name: Verify kernel
        if: success()
        run: |
          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image.gz not found!"
            exit 1
          fi

          echo "Kernel image:"
          ls -lh "$IMAGE"

          file "$IMAGE"

      - name: Collect kernel ZIP
        if: success()
        run: |
          set -e

          mkdir -p artifacts

          ZIP_FILE=$(find . \
            -type f \
            -name "AquaKernel-*.zip" \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AquaKernel ZIP not found!"

            echo
            echo "All ZIP files:"
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print

            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          cp "$ZIP_FILE" artifacts/

          ls -lh artifacts/

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evergey-kernel-lineage-23.2
          path: artifacts/AquaKernel-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evergey-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
