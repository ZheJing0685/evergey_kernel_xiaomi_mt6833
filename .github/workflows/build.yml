name: Build evergey Kernel

on:
  workflow_dispatch:
    inputs:
      with_ksu:
        description: "Build with KernelSU Next + SUSFS"
        required: true
        default: false
        type: boolean

      jobs:
        description: "Kernel compile jobs"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

  push:
    branches:
      - lineage-23.2

permissions:
  contents: read

jobs:
  build:
    name: Build MT6833 Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github-actions

    steps:

      # ============================================================
      # 1. Checkout source
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 2. Free disk space
      # ============================================================

      - name: Free disk space
        run: |
          echo "========================================"
          echo "Disk space before cleanup"
          echo "========================================"

          df -h

          echo
          echo "Cleaning unused Android / .NET / GHC files..."

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

          sudo apt-get clean

          echo
          echo "========================================"
          echo "Disk space after cleanup"
          echo "========================================"

          df -h

      # ============================================================
      # 3. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 4. Show system information
      # ============================================================

      - name: Show build environment
        run: |
          echo "========================================"
          echo "CPU INFORMATION"
          echo "========================================"

          nproc
          lscpu

          echo
          echo "========================================"
          echo "MEMORY INFORMATION"
          echo "========================================"

          free -h

          echo
          echo "========================================"
          echo "DISK INFORMATION"
          echo "========================================"

          df -h

          echo
          echo "========================================"
          echo "GIT INFORMATION"
          echo "========================================"

          git branch --show-current
          git rev-parse HEAD

          echo
          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          make kernelversion

      # ============================================================
      # 5. Inspect kernel source
      # ============================================================

      - name: Inspect kernel source
        run: |
          echo "========================================"
          echo "Kernel Makefile"
          echo "========================================"

          head -40 Makefile

          echo
          echo "========================================"
          echo "Checking everpal_defconfig"
          echo "========================================"

          if [ -f "arch/arm64/configs/everpal_defconfig" ]; then
            echo "everpal_defconfig FOUND"
            ls -lh arch/arm64/configs/everpal_defconfig
          else
            echo "ERROR: everpal_defconfig NOT FOUND!"
            exit 1
          fi

          echo
          echo "========================================"
          echo "Build scripts"
          echo "========================================"

          find . -maxdepth 3 -type f \
            \( \
              -name "build.sh" \
              -o -name "build.config*" \
            \) \
            -print | sort

      # ============================================================
      # 6. Inspect build.sh
      # ============================================================

      - name: Inspect build.sh
        run: |
          if [ ! -f "./build.sh" ]; then
            echo "ERROR: build.sh not found!"
            exit 1
          fi

          chmod +x ./build.sh

          echo "========================================"
          echo "build.sh"
          echo "========================================"

          sed -n '1,320p' ./build.sh

      # ============================================================
      # 7. Prepare build environment
      # ============================================================

      - name: Prepare build environment
        run: |
          mkdir -p out
          mkdir -p artifacts

          echo "========================================"
          echo "Build environment"
          echo "========================================"

          echo "ARCH       = $ARCH"
          echo "SUBARCH    = $SUBARCH"
          echo "LLVM       = $LLVM"
          echo "LLVM_IAS   = $LLVM_IAS"

      # ============================================================
      # 8. Configure ccache
      # ============================================================

      - name: Configure ccache
        run: |
          echo "========================================"
          echo "CCACHE"
          echo "========================================"

          ccache --version

          ccache --max-size=5G
          ccache --set-config=compression=true

          ccache -s

      # ============================================================
      # 9. Restore ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-${{ github.ref_name }}-
            kernel-ccache-${{ runner.os }}-

      # ============================================================
      # 10. Build kernel
      # ============================================================

      - name: Build kernel
        env:
          BUILD_JOBS: ${{ github.event.inputs.jobs || '2' }}
          WITH_KSU: ${{ github.event.inputs.with_ksu || 'false' }}

        run: |
          set -o pipefail

          chmod +x ./build.sh

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          echo "ARCH       = $ARCH"
          echo "SUBARCH    = $SUBARCH"
          echo "LLVM       = $LLVM"
          echo "LLVM_IAS   = $LLVM_IAS"
          echo "BUILD_JOBS = $BUILD_JOBS"
          echo "WITH_KSU   = $WITH_KSU"

          echo
          echo "========================================"
          echo "STARTING BUILD"
          echo "========================================"

          if [ "$WITH_KSU" = "true" ]; then

            echo "KernelSU Next + SUSFS ENABLED"

            ./build.sh --with-ksu 2>&1 | tee build.log

          else

            echo "KernelSU Next + SUSFS DISABLED"

            ./build.sh 2>&1 | tee build.log

          fi

      # ============================================================
      # 11. Check build result
      # ============================================================

      - name: Check build result
        if: always()
        run: |
          echo "========================================"
          echo "BUILD LOG - LAST 300 LINES"
          echo "========================================"

          if [ -f build.log ]; then
            tail -300 build.log
          else
            echo "build.log not found."
          fi

          echo
          echo "========================================"
          echo "KERNEL IMAGE"
          echo "========================================"

          find . -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "Image-dtb" \
            \) \
            -not -path "./.git/*" \
            -print

          echo
          echo "========================================"
          echo "DTB"
          echo "========================================"

          find . -type f \
            -name "*.dtb" \
            -not -path "./.git/*" \
            -print

          echo
          echo "========================================"
          echo "KERNEL MODULES"
          echo "========================================"

          find . -type f \
            -name "*.ko" \
            -not -path "./.git/*" \
            -print

          echo
          echo "========================================"
          echo "ZIP FILES"
          echo "========================================"

          find . -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            -print

          echo
          echo "========================================"
          echo "CCACHE STATISTICS"
          echo "========================================"

          ccache -s || true

      # ============================================================
      # 12. Verify kernel image
      # ============================================================

      - name: Verify kernel image
        if: success()
        run: |
          echo "========================================"
          echo "VERIFYING KERNEL IMAGE"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image.gz not found!"
            echo
            echo "Expected:"
            echo "$IMAGE"
            echo
            echo "Actual boot directory:"
            find out/arch/arm64/boot -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Kernel image found:"
          ls -lh "$IMAGE"

          file "$IMAGE"

      # ============================================================
      # 13. Collect AnyKernel3 ZIP
      # ============================================================

      - name: Collect AnyKernel package
        if: success()
        run: |
          set -e

          mkdir -p artifacts

          echo "========================================"
          echo "SEARCHING FOR AQUAKERNEL ZIP"
          echo "========================================"

          ZIP_FILE=$(find . \
            -type f \
            -name "AquaKernel-*.zip" \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then

            echo "ERROR: AquaKernel ZIP not found!"

            echo
            echo "========================================"
            echo "ALL ZIP FILES"
            echo "========================================"

            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print

            echo
            echo "========================================"
            echo "ROOT DIRECTORY"
            echo "========================================"

            ls -lah

            exit 1
          fi

          echo "Kernel ZIP found:"
          echo "$ZIP_FILE"

          cp "$ZIP_FILE" artifacts/

          echo
          echo "========================================"
          echo "ARTIFACT"
          echo "========================================"

          ls -lh artifacts/

      # ============================================================
      # 14. Upload kernel ZIP
      # ============================================================

      - name: Upload kernel ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evergey-kernel-lineage-23.2
          path: artifacts/AquaKernel-*.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 15. Upload build log
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evergey-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
