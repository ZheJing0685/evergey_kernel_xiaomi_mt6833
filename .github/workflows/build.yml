name: Build Camellia Kernel

on:
  workflow_dispatch:
    inputs:
      with_ksu:
        description: "Build with KernelSU Next + SUSFS"
        required: true
        default: false
        type: boolean

      jobs:
        description: "Kernel compile jobs"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

  push:
    branches:
      - lineage-23.2

permissions:
  contents: read

jobs:
  build:
    name: Build Camellia Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      LLVM: 1
      LLVM_IAS: 1

      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github-actions

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: lineage-23.2
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libxml2 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. Runner information
      # ============================================================

      - name: Show runner information
        run: |
          echo "========================================"
          echo "CPU"
          echo "========================================"

          nproc
          lscpu

          echo
          echo "========================================"
          echo "MEMORY"
          echo "========================================"

          free -h

          echo
          echo "========================================"
          echo "DISK"
          echo "========================================"

          df -h

          echo
          echo "========================================"
          echo "GIT"
          echo "========================================"

          git rev-parse HEAD

          echo
          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          make kernelversion

      # ============================================================
      # 4. Verify Camellia source
      # ============================================================

      - name: Verify Camellia source
        run: |
          echo "========================================"
          echo "Checking Camellia source"
          echo "========================================"

          test -f build.sh
          test -f scripts/config
          test -f arch/arm64/configs/camellia_defconfig

          chmod +x build.sh
          chmod +x scripts/config

          echo
          echo "Camellia defconfig:"
          ls -lh arch/arm64/configs/camellia_defconfig

          echo
          echo "Device project:"
          grep '^CONFIG_ARCH_MTK_PROJECT' \
            arch/arm64/configs/camellia_defconfig

          echo
          echo "Camera:"
          grep '^CONFIG_CUSTOM_KERNEL_IMGSENSOR' \
            arch/arm64/configs/camellia_defconfig

          echo
          echo "LCM:"
          grep '^CONFIG_CUSTOM_KERNEL_LCM' \
            arch/arm64/configs/camellia_defconfig

          echo
          echo "Fingerprint:"
          grep '^CONFIG_MTK_FINGERPRINT_SELECT' \
            arch/arm64/configs/camellia_defconfig

      # ============================================================
      # 5. Show build.sh
      # ============================================================

      - name: Inspect build.sh
        run: |
          echo "========================================"
          echo "build.sh"
          echo "========================================"

          sed -n '1,420p' build.sh

      # ============================================================
      # 6. Build configuration
      # ============================================================

      - name: Show workflow configuration
        run: |
          echo "========================================"
          echo "Workflow configuration"
          echo "========================================"

          echo "ARCH       = $ARCH"
          echo "SUBARCH    = $SUBARCH"
          echo "LLVM       = $LLVM"
          echo "LLVM_IAS   = $LLVM_IAS"

          echo
          echo "KernelSU:"
          echo "${{ github.event.inputs.with_ksu || 'false' }}"

          echo
          echo "Build jobs:"
          echo "${{ github.event.inputs.jobs || '2' }}"

      # ============================================================
      # 7. Prepare directories
      # ============================================================

      - name: Prepare directories
        run: |
          mkdir -p out
          mkdir -p artifacts

      # ============================================================
      # 8. Build kernel
      # ============================================================

      - name: Build kernel
        env:
          BUILD_JOBS: ${{ github.event.inputs.jobs || '2' }}
          WITH_KSU: ${{ github.event.inputs.with_ksu || 'false' }}

        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD START"
          echo "========================================"

          echo "BUILD_JOBS=$BUILD_JOBS"
          echo "WITH_KSU=$WITH_KSU"

          echo
          echo "========================================"

          if [ "$WITH_KSU" = "true" ]; then

            ./build.sh --with-ksu 2>&1 | tee build.log
            BUILD_RESULT=${PIPESTATUS[0]}

          else

            ./build.sh 2>&1 | tee build.log
            BUILD_RESULT=${PIPESTATUS[0]}

          fi

          echo
          echo "BUILD_RESULT=$BUILD_RESULT"

          exit "$BUILD_RESULT"

      # ============================================================
      # 9. Diagnostics
      # ============================================================

      - name: Build diagnostics
        if: always()
        run: |
          echo "========================================"
          echo "LAST 400 LINES"
          echo "========================================"

          if [ -f build.log ]; then
            tail -400 build.log
          else
            echo "build.log not found."
          fi

          echo
          echo "========================================"
          echo "IMAGE FILES"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
            \) \
            -not -path "./.git/*" \
            -print

          echo
          echo "========================================"
          echo "DTB FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.dtb" \
            -not -path "./.git/*" \
            -print

          echo
          echo "========================================"
          echo "CONFIG"
          echo "========================================"

          if [ -f out/.config ]; then
            grep '^CONFIG_ARCH_MTK_PROJECT' out/.config || true
            grep '^CONFIG_LOCALVERSION' out/.config || true
            grep '^CONFIG_LTO' out/.config || true
            grep '^CONFIG_CC_STACKPROTECTOR' out/.config || true
          fi

      # ============================================================
      # 10. Verify Image.gz
      # ============================================================

      - name: Verify Image.gz
        if: success()
        run: |
          IMAGE="out/arch/arm64/boot/Image.gz"

          echo "========================================"
          echo "VERIFY IMAGE"
          echo "========================================"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image.gz not found."
            exit 1
          fi

          ls -lh "$IMAGE"

          echo
          file "$IMAGE"

          echo
          echo "Kernel version string:"

          gunzip -c "$IMAGE" > /tmp/AquaCamellia-Image

          strings /tmp/AquaCamellia-Image \
            | grep -m1 "Linux version"

          rm -f /tmp/AquaCamellia-Image

      # ============================================================
      # 11. Upload kernel artifacts
      # ============================================================

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-aquakernel
          path: |
            artifacts/Image.gz
            artifacts/camellia.config
            artifacts/System.map
            artifacts/arch/
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 12. Upload build log
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
